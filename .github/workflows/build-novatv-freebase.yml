name: Nova TV v0.4 Personalized
on:
  push:
    branches:
      - feature/novatv-free-my-tv
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout MIT-licensed upstream
        run: |
          git clone --quiet https://github.com/simbasjungles/free-my-tv.git upstream
          cd upstream
          git checkout --quiet --detach 7e6754c1887182fd29220fc605833336bc69e6a4
          test -f LICENSE && test -f build.sh && test -f app/AndroidManifest.xml
      - name: Apply safe Hisense preview adaptation
        run: |
          cp novatv-free-base/patch_safe_preview.py upstream/patch_safe_preview.py
          cp novatv-free-base/patch_v04.py upstream/patch_v04.py
          cp novatv-free-base/generate_assets.py upstream/generate_assets.py
          cd upstream
          python3 patch_safe_preview.py
          python3 patch_v04.py
          python3 generate_assets.py
          cp config.example.properties config.properties
          cat >>config.properties <<'EOF'
          city=Lisboa
          latitude=38.72
          longitude=-9.14
          tmdb_region=PT
          language=pt
          currency=EUR
          temperature=C
          show_crypto=false
          hide_animation=false
          disable_assistant=false
          EOF
          cp LICENSE app/assets/NovaTV_UPSTREAM_MIT_LICENSE.txt
      - name: Build preview APK
        run: |
          cd upstream
          bash build.sh
          mkdir -p ../out
          cp FreeMyTV.apk ../out/NovaTV-v0.4-Hisense.apk
          cp LICENSE ../out/MIT_LICENSE_UPSTREAM.txt
          cp ../novatv-free-base/README.md ../out/README-LEIA-ME.txt
          ls -lh ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-v0.4-Hisense
          path: out/*
          if-no-files-found: error
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "novatv-freebase-v0.4" >/dev/null 2>&1 || gh release create "novatv-freebase-v0.4" out/NovaTV-v0.4-Hisense.apk out/MIT_LICENSE_UPSTREAM.txt out/README-LEIA-ME.txt --target "$GITHUB_SHA" --title "Nova TV v0.4 — Fundos, demo de filmes e favoritos" --notes "Nova TV v0.4 (Hisense 32A4HA / Android TV 11): baseada no Free My TV Android (MIT, SHA 7e6754c). Inclui 1 wallpaper fotográfico 1920x1080 16:9 (fonte Unsplash, fallback local), seleção/restauro do fundo por Home Settings > Papel de parede, três cartões de filmes e séries FICTÍCIOS offline enquanto Nova Play não está ligada, e edição nativa da dock por Settings > Shelf ou OK prolongado. Launcher original preservado, sem root, sem ADB, sem alterações aos serviços do sistema. PRE-RELEASE. Para atualizar a v0.3, desinstala-a previamente se as assinaturas diferirem." --prerelease --latest=false
