name: Nova TV v0.5 Hisense
on:
  push:
    branches:
      - feature/novatv-v05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout MIT-licensed upstream
        run: |
          git clone --quiet https://github.com/simbasjungles/free-my-tv.git upstream
          cd upstream
          git checkout --quiet --detach 7e6754c1887182fd29220fc605833336bc69e6a4
          test -f LICENSE && test -f build.sh && test -f app/AndroidManifest.xml
      - name: Apply safe Hisense preview adaptation
        run: |
          cp novatv-free-base/patch_safe_preview.py upstream/patch_safe_preview.py
          cp novatv-free-base/patch_v04.py upstream/patch_v04.py
          cp novatv-free-base/patch_v05.py upstream/patch_v05.py
          cp novatv-free-base/generate_assets.py upstream/generate_assets.py
          cd upstream
          python3 patch_safe_preview.py
          python3 patch_v04.py
          python3 patch_v05.py
          python3 generate_assets.py
          cp config.example.properties config.properties
          cat >>config.properties <<'EOF'
          city=Lisboa
          latitude=38.72
          longitude=-9.14
          tmdb_region=PT
          language=pt
          currency=EUR
          temperature=C
          show_crypto=false
          hide_animation=false
          disable_assistant=false
          EOF
          cp LICENSE app/assets/NovaTV_UPSTREAM_MIT_LICENSE.txt
      - name: Build preview APK
        run: |
          cd upstream
          bash build.sh
          mkdir -p ../out
          cp FreeMyTV.apk ../out/NovaTV-v0.5-Hisense.apk
          cp LICENSE ../out/MIT_LICENSE_UPSTREAM.txt
          cp ../novatv-free-base/README.md ../out/README-LEIA-ME.txt
          ls -lh ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-v0.5-Hisense
          path: out/*
          if-no-files-found: error
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "novatv-freebase-v0.5" >/dev/null 2>&1 && gh release upload "novatv-freebase-v0.5" out/NovaTV-v0.5-Hisense.apk out/MIT_LICENSE_UPSTREAM.txt out/README-LEIA-ME.txt --clobber || gh release create "novatv-freebase-v0.5" out/NovaTV-v0.5-Hisense.apk out/MIT_LICENSE_UPSTREAM.txt out/README-LEIA-ME.txt --target "$GITHUB_SHA" --title "Nova TV v0.5 — Fundo Cover, apps e temperatura" --notes "Nova TV v0.5 para Hisense 32A4HA/Android TV 11, Free My TV MIT. Fundo de paisagem sharp 16:9 em modo Cover, sem barras pretas; menu OK prolongado nos destaques para remover/reordenar, e em Todas Apps para adicionar/remover, abrir Informações e iniciar desinstalação nativa Android de apps de utilizador. Temperatura Open-Meteo (só quando dados disponíveis), junto aos ícones superiores. Inclui filmes fictícios de demonstração e papel de parede próprio. Não altera o launcher de fábrica, não usa root/ADB. Pré-release de teste." --prerelease --latest=false
