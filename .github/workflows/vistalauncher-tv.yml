name: VistaLauncher TV - Native Vista ecosystem
on:
  push:
    branches: [feature/vistalauncher-v1]
    paths:
      - "novatv-free-base/**"
      - ".github/workflows/vistalauncher-tv.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned upstream MIT launcher
        run: |
          git clone --quiet https://github.com/simbasjungles/free-my-tv.git upstream
          git -C upstream checkout --quiet --detach 7e6754c1887182fd29220fc605833336bc69e6a4
          test -f upstream/LICENSE
      - name: Apply the original Nova TV lineage and VistaLauncher TV integration
        run: |
          cp novatv-free-base/patch_safe_preview.py upstream/patch_safe_preview.py
          cp novatv-free-base/patch_v04.py upstream/patch_v04.py
          cp novatv-free-base/patch_v05.py upstream/patch_v05.py
          cp novatv-free-base/patch_v06_vista.py upstream/patch_v06_vista.py
          cp novatv-free-base/patch_v07_hub.py upstream/patch_v07_hub.py
          cp novatv-free-base/generate_assets.py upstream/generate_assets.py
          cd upstream
          python3 patch_safe_preview.py
          python3 patch_v04.py
          python3 patch_v05.py
          python3 patch_v06_vista.py
          python3 patch_v07_hub.py
          python3 generate_assets.py
          cp config.example.properties config.properties
          cat >> config.properties <<'EOF'
          city=Lisboa
          latitude=38.72
          longitude=-9.14
          tmdb_region=PT
          language=pt
          currency=EUR
          temperature=C
          show_crypto=false
          hide_animation=false
          disable_assistant=false
          EOF
          cp LICENSE app/assets/VistaLauncher_UPSTREAM_MIT_LICENSE.txt
      - name: Verify original package and native Vista integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "manifest package": ("upstream/app/AndroidManifest.xml", 'package="io.freemytv"'),
              "manifest label": ("upstream/app/AndroidManifest.xml", 'android:label="VistaLauncher"'),
              "feed authority": ("upstream/app/AndroidManifest.xml", 'com.vistastream.tv.homefeed'),
              "feed code": ("upstream/app/src/io/freemytv/Recs.java", 'VistaFeed.picks(context, kind)'),
              "anime tab": ("upstream/app/src/io/freemytv/HomeView.java", '"Animes"'),
              "hub in manifest": ("upstream/app/AndroidManifest.xml", "VistaHubActivity"),
              "hub in native shelf": ("upstream/app/src/io/freemytv/HomeApps.java", '"vista-hub"'),
              "hub resume section": ("upstream/app/src/io/freemytv/VistaHubActivity.java", '"Continuar a assistir"'),
              "hub anime section": ("upstream/app/src/io/freemytv/VistaHubActivity.java", '"Animes"'),
              "hub feed categories": ("upstream/app/src/io/freemytv/VistaFeed.java", 'static List<Entry> section('),
              "vista account": ("upstream/app/AndroidManifest.xml", 'VistaAccountActivity'),
              "vista music": ("upstream/app/src/io/freemytv/HomeApps.java", 'com.vistamusic.app'),
              "vista tube": ("upstream/app/src/io/freemytv/HomeApps.java", 'app.vistatube.mobile.debug')
          }
          missing = []
          for name, (path, needle) in checks.items():
              found = needle in Path(path).read_text(encoding="utf-8")
              print(("PASS" if found else "FAIL") + ": " + name, flush=True)
              if not found: missing.append(name)
          if missing: raise SystemExit("Missing: " + ", ".join(missing))
          PY
      - name: Build APK for Hisense Android TV
        run: |
          cd upstream
          bash build.sh
          mkdir -p ../out
          cp FreeMyTV.apk ../out/VistaLauncher-TV-v1.1.1-preview.apk
          cp LICENSE ../out/MIT_LICENSE_UPSTREAM.txt
          cp ../novatv-free-base/README.md ../out/NOVA_TV_BASE_README.txt
          cd ../out && sha256sum VistaLauncher-TV-v1.1.1-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VistaLauncher-TV-v1.1.1-APK
          path: out/*
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vistalauncher-tv-v1.1.1"
          NOTES="VistaLauncher v1.1.1 (pre-release): Native Vista Hub TV with remote-ready app cards, curated VistaStream movies, series, anime and continue watching. Installed apps launch with their existing identity, storage and playback. Updated v0.16+ VistaStream supports deep-linking into TV details; no apps are bundled or silently installed. Preserves original NovaTV package, wallpaper, highlights and layout. Original details: preserva a base Nova TV v0.5 e o pacote io.freemytv. Adiciona shelf nativa para VistaStream, VistaTube, VistaMusic e VistaBrowser, ecrã Vista ID opcional, Home com 4 separadores (Para ti, Filmes, Séries, Animes), recomendações reais do catálogo local do VistaStream sem demonstrações fictícias quando VS instalado, e um título de Continuar a assistir quando existir progresso não concluído. Requer VistaStream 0.16+ instalado na mesma TV para o feed; requer Vista ID 0.2+ para conta local. Não inclui os 4 apps dentro do APK, nem sincronização cloud; cada app deve ser instalado separadamente. Esta versão NÃO substitui à força o Home original da TV. Teste com comando da televisão."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/VistaLauncher-TV-v1.1.1-preview.apk out/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" out/VistaLauncher-TV-v1.1.1-preview.apk out/SHA256SUMS.txt out/MIT_LICENSE_UPSTREAM.txt out/NOVA_TV_BASE_README.txt --target "$GITHUB_SHA" --title "VistaLauncher TV v1.1.1 — Native Vista Hub (preview)" --notes "$NOTES" --prerelease --latest=false
          fi
