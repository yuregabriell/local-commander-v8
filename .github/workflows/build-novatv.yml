name: Nova TV + Remote APKs
on:
  push:
    branches:
      - build/novatv-launcher
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile launcher and mobile remote
        run: |
          gradle -p novatv --no-daemon :app:assembleDebug
          gradle -p novatv-remote --no-daemon :app:assembleDebug
      - name: Prepare two APKs
        run: |
          mkdir -p out
          cp novatv/app/build/outputs/apk/debug/app-debug.apk out/NovaTV-Launcher-v0.2.apk
          cp novatv-remote/app/build/outputs/apk/debug/app-debug.apk out/NovaTV-Remote-v0.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Launcher-and-Remote
          path: out/*.apk
          if-no-files-found: error
      - name: Publicar Release do launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "novatv-launcher-v0.2" >/dev/null 2>&1 || gh release create "novatv-launcher-v0.2" out/NovaTV-Launcher-v0.2.apk --target "$GITHUB_SHA" --title "Nova TV Launcher v0.2 (Android TV)" --notes "Versão de teste para Hisense 32A4HA com Android TV 11. Interface híbrida, wallpapers, favoritos e controlo por telemóvel. Não substitui o launcher de fábrica." --prerelease --latest=false
      - name: Publicar Release do controlo Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "novatv-remote-v0.1.1" >/dev/null 2>&1 || gh release create "novatv-remote-v0.1.1" out/NovaTV-Remote-v0.1.1.apk --target "$GITHUB_SHA" --title "Nova TV Remote v0.1.1 (Android) - Correção" --notes "Correção da inicialização do comando Wi-Fi para Nova TV Launcher v0.2. Inclui ecrã de diagnóstico caso exista incompatibilidade no telemóvel." --prerelease --latest=false
