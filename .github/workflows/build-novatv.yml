name: Nova TV APK
on:
  push:
    branches:
      - build/novatv-launcher
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Nova TV
        run: gradle -p novatv --no-daemon :app:assembleDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp novatv/app/build/outputs/apk/debug/app-debug.apk out/NovaTV-Hisense-Android11-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Hisense-APK
          path: out/NovaTV-Hisense-Android11-v0.1.apk
          if-no-files-found: error
