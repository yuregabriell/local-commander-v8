name: Nova TV + Remote APKs
on:
  push:
    branches:
      - build/novatv-launcher
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile launcher and mobile remote
        run: |
          gradle -p novatv --no-daemon :app:assembleDebug
          gradle -p novatv-remote --no-daemon :app:assembleDebug
      - name: Prepare two APKs
        run: |
          mkdir -p out
          cp novatv/app/build/outputs/apk/debug/app-debug.apk out/NovaTV-Launcher-v0.2.apk
          cp novatv-remote/app/build/outputs/apk/debug/app-debug.apk out/NovaTV-Remote-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Launcher-and-Remote
          path: out/*.apk
          if-no-files-found: error
